<svg width="2320" height="1240" viewBox="0 0 1160 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/>
    </marker>
    <marker id="arrowDim2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A97A3"/>
    </marker>
  </defs>

  <style>
    .comp-title { font: 600 15px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #141A21; }
    .comp-title-lg { font: 700 16px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #141A21; }
    .comp-sub { font: 400 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #5C6B78; }
    .mono-dim { font: 400 11px "SF Mono", Menlo, Consolas, monospace; fill: #7C8996; }
    .flow-label { font: 500 11.5px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #5C6B78; }
    .legend-label { font: 400 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #5C6B78; }
    .caption { font: 400 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #7C8996; }
    .comp-box { fill: #ffffff; stroke: #D7DFE4; stroke-width: 1.2; }
    .comp-box-accent { fill: #E4F4F7; stroke: #0C8599; stroke-width: 1.4; }
    .span-box { fill: #E4F4F7; stroke: #0C8599; stroke-width: 1.4; }
  </style>

  <rect x="0" y="0" width="1160" height="620" fill="#F6F8FA"/>

  <!-- 图例 -->
  <line x1="40" y1="30" x2="80" y2="30" stroke="#0C8599" stroke-width="2.5"/>
  <text x="90" y="34" class="legend-label">业务流量（真实转发路径）</text>
  <line x1="330" y1="30" x2="370" y2="30" stroke="#8A97A3" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="380" y="34" class="legend-label">镜像流量（交换机复制的只读副本）</text>

  <!-- 互联网 -->
  <rect x="470" y="90" width="220" height="50" rx="10" class="comp-box"/>
  <text x="580" y="120" text-anchor="middle" class="comp-title">互联网 / 外部网络</text>

  <line x1="580" y1="140" x2="580" y2="172" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="614" y="160" class="flow-label">南北向流量</text>

  <!-- 出口网关 -->
  <rect x="470" y="176" width="220" height="50" rx="10" class="comp-box"/>
  <text x="580" y="206" text-anchor="middle" class="comp-title">出口网关 / 防火墙</text>

  <line x1="580" y1="226" x2="580" y2="258" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 核心交换机 -->
  <rect x="380" y="262" width="400" height="64" rx="10" class="comp-box"/>
  <text x="580" y="290" text-anchor="middle" class="comp-title-lg">核心交换机</text>
  <text x="580" y="310" text-anchor="middle" class="comp-sub">南北向、东西向流量都在此汇聚转发</text>

  <!-- SPAN 镜像口，画成挂在交换机右侧的一个端口 -->
  <rect x="768" y="272" width="112" height="44" rx="6" class="span-box"/>
  <text x="824" y="290" text-anchor="middle" class="comp-title" style="font-size:13px">SPAN</text>
  <text x="824" y="306" text-anchor="middle" class="comp-sub" style="font-size:11px">镜像口</text>

  <!-- 东西向：交换机 -> 三台业务服务器 -->
  <line x1="460" y1="326" x2="180" y2="428" stroke="#0C8599" stroke-width="1.8" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <line x1="540" y1="326" x2="400" y2="428" stroke="#0C8599" stroke-width="1.8" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <line x1="600" y1="326" x2="620" y2="428" stroke="#0C8599" stroke-width="1.8" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="400" y="404" text-anchor="middle" class="flow-label">东西向流量 · 内网服务器之间</text>

  <rect x="60" y="430" width="180" height="60" rx="8" class="comp-box"/>
  <text x="150" y="456" text-anchor="middle" class="comp-title">业务服务器 A</text>
  <text x="150" y="476" text-anchor="middle" class="mono-dim">Web</text>

  <rect x="290" y="430" width="180" height="60" rx="8" class="comp-box"/>
  <text x="380" y="456" text-anchor="middle" class="comp-title">业务服务器 B</text>
  <text x="380" y="476" text-anchor="middle" class="mono-dim">App</text>

  <rect x="520" y="430" width="180" height="60" rx="8" class="comp-box"/>
  <text x="610" y="456" text-anchor="middle" class="comp-title">业务服务器 C</text>
  <text x="610" y="476" text-anchor="middle" class="mono-dim">Database</text>

  <!-- 镜像副本：SPAN 口 -> 独立主机，最后一段保持垂直，箭头朝下落入 Netra 主机顶部 -->
  <path d="M 824 316 L 824 372 L 970 372 L 970 404" fill="none" stroke="#8A97A3" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowDim2)"/>
  <text x="897" y="364" text-anchor="middle" class="flow-label">只读副本</text>
  <text x="897" y="392" text-anchor="middle" class="flow-label">单向、不产生响应包</text>

  <!-- 独立主机：Netra -->
  <rect x="800" y="404" width="300" height="130" rx="10" class="comp-box-accent"/>
  <text x="820" y="430" class="comp-sub">独立主机 · 旁路部署</text>
  <text x="820" y="458" class="comp-title-lg" style="font-size:20px">Netra</text>
  <text x="820" y="482" class="comp-sub">只读接收 SPAN 镜像口的流量副本</text>
  <text x="820" y="502" class="comp-sub">不接入转发路径，不是业务网络的一环</text>
  <text x="820" y="522" class="mono-dim">挂物理网卡收镜像流量 · XDP 处理</text>

  <!-- 底部说明 -->
  <text x="580" y="570" text-anchor="middle" class="caption">南北向：内网与外网/互联网之间的流量；东西向：内网服务器彼此之间的流量——两者都会经过核心交换机。</text>
  <text x="580" y="590" text-anchor="middle" class="caption">交换机的 SPAN 镜像口把选定流量复制一份、单向发给独立主机上的 Netra，原始转发路径和业务网络完全不受影响。</text>
</svg>
