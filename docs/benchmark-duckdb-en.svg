<svg width="2000" height="1160" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 17px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #141A21; }
    .axis-label { font: 400 11px "SF Mono", Menlo, Consolas, monospace; fill: #7C8996; }
    .group-label { font: 600 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #141A21; text-anchor: middle; }
    .bar-value { font: 700 14px "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; fill: #0C8599; }
    .grid-line { stroke: #E5E9ED; stroke-width: 1; }
    .caption { font: 400 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #7C8996; }
  </style>

  <rect x="0" y="0" width="1000" height="580" fill="#F6F8FA"/>
  <rect x="20" y="20" width="960" height="540" rx="12" fill="#FFFFFF" stroke="#D7DFE4" stroke-width="1.2"/>

  <text x="48" y="64" class="title">DuckDB Query Performance</text>

  <!-- Y axis grid: 0-4s -->
  <line x1="90" y1="460" x2="920" y2="460" class="grid-line"/>
  <line x1="90" y1="385" x2="920" y2="385" class="grid-line"/>
  <line x1="90" y1="310" x2="920" y2="310" class="grid-line"/>
  <line x1="90" y1="235" x2="920" y2="235" class="grid-line"/>
  <line x1="90" y1="160" x2="920" y2="160" class="grid-line"/>
  <text x="80" y="464" text-anchor="end" class="axis-label">0s</text>
  <text x="80" y="389" text-anchor="end" class="axis-label">1s</text>
  <text x="80" y="314" text-anchor="end" class="axis-label">2s</text>
  <text x="80" y="239" text-anchor="end" class="axis-label">3s</text>
  <text x="80" y="164" text-anchor="end" class="axis-label">4s</text>
  <line x1="90" y1="160" x2="90" y2="460" stroke="#D7DFE4" stroke-width="1.2"/>

  <!-- 21.3M records -->
  <rect x="210" y="389" width="80" height="71" rx="3" fill="#0C8599"/>
  <text x="250" y="382" class="bar-value">0.95s</text>
  <text x="250" y="490" class="group-label">21.3M records</text>

  <!-- 45M records -->
  <rect x="510" y="293" width="80" height="167" rx="3" fill="#0C8599"/>
  <text x="550" y="286" class="bar-value">2.23s</text>
  <text x="550" y="490" class="group-label">45M records</text>

  <!-- 200M+ records -->
  <rect x="810" y="170" width="80" height="290" rx="3" fill="#0C8599"/>
  <text x="850" y="163" class="bar-value">3.86s</text>
  <text x="850" y="490" class="group-label">200M+ records</text>

  <text x="48" y="524" class="caption">As data volume grew from 21.3M to 200M+ records (~10x), query time stayed in single-digit seconds throughout.</text>
</svg>
