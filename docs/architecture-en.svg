<svg width="2320" height="2060" viewBox="0 0 1160 1030" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0C8599"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A97A3"/>
    </marker>
  </defs>

  <style>
    .band-label { font: 700 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #0C8599; letter-spacing: 1.5px; }
    .comp-title { font: 600 15px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #141A21; }
    .comp-sub { font: 400 12.5px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #5C6B78; }
    .mono { font: 500 11.5px "SF Mono", Menlo, Consolas, monospace; fill: #0C8599; }
    .mono-dim { font: 500 13px "SF Mono", Menlo, Consolas, monospace; fill: #3D4B56; }
    .flow-label { font: 500 11.5px -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #8A97A3; }
    .comp-box { fill: #ffffff; stroke: #D7DFE4; stroke-width: 1.2; }
    .comp-box-accent { fill: #E4F4F7; stroke: #0C8599; stroke-width: 1.2; }
  </style>

  <rect x="0" y="0" width="1160" height="1030" fill="#F6F8FA"/>

  <!-- ============ BAND 1: network mirroring ============ -->
  <rect x="40" y="34" width="1080" height="86" rx="10" fill="#FFFFFF" stroke="#D7DFE4" stroke-width="1.2"/>
  <text x="64" y="60" class="band-label">NETWORK LAYER · OUT-OF-BAND MIRRORING</text>
  <rect x="64" y="72" width="230" height="36" rx="8" class="comp-box"/>
  <text x="179" y="95" text-anchor="middle" class="comp-title">Switch SPAN / Mirror Port</text>
  <line x1="294" y1="90" x2="360" y2="90" stroke="#8A97A3" stroke-width="1.5" marker-end="url(#arrowDim)"/>
  <rect x="366" y="72" width="180" height="36" rx="8" class="comp-box"/>
  <text x="456" y="95" text-anchor="middle" class="comp-title">Physical NIC</text>
  <text x="820" y="95" text-anchor="middle" class="comp-sub">Read-only mirrored traffic; doesn't touch the path or add traffic</text>

  <!-- flow arrow 1 -->
  <line x1="580" y1="120" x2="580" y2="156" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BAND 2: kernel space XDP/eBPF ============ -->
  <rect x="40" y="160" width="1080" height="164" rx="10" fill="#ECEEF1" stroke="#D7DFE4" stroke-width="1.2"/>
  <text x="64" y="186" class="band-label">KERNEL SPACE · XDP / eBPF</text>

  <rect x="64" y="200" width="336" height="108" rx="8" class="comp-box-accent"/>
  <text x="82" y="226" class="comp-title">XDP Program</text>
  <text x="82" y="248" class="comp-sub">Attached to the NIC driver's RX path</text>
  <text x="82" y="266" class="comp-sub">Native mode runs before sk_buff allocation</text>
  <text x="82" y="290" class="mono">Zero-copy · CPU doesn't scale with pps</text>

  <rect x="420" y="200" width="676" height="108" rx="8" class="comp-box"/>
  <text x="438" y="226" class="comp-title">Kernel-space Aggregation</text>
  <text x="438" y="248" class="comp-sub">5-tuple / IP / port counting aggregation (eBPF map)</text>
  <text x="438" y="266" class="comp-sub">TLS ClientHello bytes captured → ring buffer (not parsed in-kernel, just forwarded)</text>
  <text x="438" y="290" class="mono-dim">Userspace only reads pre-aggregated results</text>

  <line x1="580" y1="324" x2="580" y2="356" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BAND 3: userspace collection ============ -->
  <rect x="40" y="360" width="1080" height="120" rx="10" fill="#FFFFFF" stroke="#D7DFE4" stroke-width="1.2"/>
  <text x="64" y="386" class="band-label">USERSPACE · GO COLLECTION / AGGREGATION</text>
  <rect x="64" y="400" width="420" height="60" rx="8" class="comp-box"/>
  <text x="82" y="424" class="comp-title">Aggregator</text>
  <text x="82" y="444" class="mono">Default 5s/tick · reads eBPF map, rolls buckets</text>

  <rect x="508" y="400" width="588" height="60" rx="8" class="comp-box"/>
  <text x="526" y="424" class="comp-title">Heuristic Detection · SNI Parsing</text>
  <text x="526" y="444" class="comp-sub">Scan/DDoS/high-volume checks · resolves domain from ClientHello</text>

  <!-- main flow arrow to storage -->
  <line x1="580" y1="480" x2="580" y2="516" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- side branch: alert push doesn't wait on the storage write; alerts are
       still persisted via the normal snap path below (PersistScanAlerts,
       default on), this is only about notification latency, not an
       alternate/exclusive data path. Routed outside the band rects (x>1120)
       so it visibly passes AROUND the storage layer rather than appearing to
       terminate inside it. -->
  <path d="M 484 400 L 484 390 L 1140 390 L 1140 860 L 1088 860" fill="none" stroke="#8A97A3" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowDim)"/>
  <text x="900" y="378" text-anchor="middle" class="flow-label">Hit → alert sent immediately (SQLite write happens concurrently)</text>

  <!-- ============ BAND 4: storage layer ============ -->
  <rect x="40" y="520" width="1080" height="220" rx="10" fill="#FFFFFF" stroke="#D7DFE4" stroke-width="1.2"/>
  <text x="64" y="546" class="band-label">STORAGE LAYER</text>

  <rect x="64" y="560" width="330" height="164" rx="8" class="comp-box"/>
  <text x="82" y="586" class="comp-title">SQLite</text>
  <text x="82" y="608" class="comp-sub">Config / users / alert records</text>
  <text x="82" y="626" class="comp-sub">MCP config / AI chat history</text>
  <text x="82" y="648" class="mono-dim">Low-frequency, strongly consistent</text>

  <rect x="410" y="560" width="670" height="164" rx="8" class="comp-box-accent"/>
  <text x="428" y="586" class="comp-title">DuckDB</text>
  <text x="428" y="608" class="comp-sub">High-frequency history: 5-tuple / IP / port / domain</text>
  <rect x="428" y="622" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#0C8599" stroke-width="1"/>
  <text x="518" y="644" text-anchor="middle" class="mono">Hot buffer</text>
  <text x="518" y="660" text-anchor="middle" class="mono-dim">current cycle</text>
  <line x1="608" y1="652" x2="638" y2="652" stroke="#0C8599" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="644" y="622" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#0C8599" stroke-width="1"/>
  <text x="734" y="644" text-anchor="middle" class="mono">Parquet files</text>
  <text x="734" y="660" text-anchor="middle" class="mono-dim">sealed hourly</text>
  <line x1="824" y1="652" x2="854" y2="652" stroke="#0C8599" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="860" y="622" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#0C8599" stroke-width="1"/>
  <text x="960" y="640" text-anchor="middle" class="mono">Per-file Top-K cache</text>
  <text x="960" y="658" text-anchor="middle" class="mono-dim">warmed on startup</text>
  <text x="428" y="706" class="mono-dim">memory_limit = available mem × 80% (won't let one query take down the process)</text>

  <line x1="580" y1="740" x2="580" y2="776" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BAND 5: application & integration ============ -->
  <rect x="40" y="780" width="1080" height="210" rx="10" fill="#FFFFFF" stroke="#D7DFE4" stroke-width="1.2"/>
  <text x="64" y="806" class="band-label">APPLICATION &amp; INTEGRATION</text>

  <rect x="64" y="820" width="330" height="146" rx="8" class="comp-box"/>
  <text x="82" y="846" class="comp-title">Web Console</text>
  <text x="82" y="868" class="comp-sub">Live dashboard · traffic explorer</text>
  <text x="82" y="886" class="comp-sub">Threat detection · system config</text>

  <rect x="410" y="820" width="330" height="146" rx="8" class="comp-box-accent"/>
  <text x="428" y="846" class="comp-title">AI Assistant</text>
  <text x="428" y="868" class="comp-sub">Any OpenAI-compatible model</text>
  <text x="428" y="886" class="comp-sub">MCP extensions: HTTP / stdio</text>
  <text x="428" y="908" class="mono-dim">Answers grounded in real history</text>

  <rect x="756" y="820" width="324" height="146" rx="8" class="comp-box"/>
  <text x="774" y="846" class="comp-title">Alerts &amp; Export</text>
  <text x="774" y="868" class="comp-sub">WeCom / DingTalk / Feishu</text>
  <text x="774" y="886" class="comp-sub">Kafka async export (optional)</text>

  <text x="1080" y="1018" text-anchor="end" class="mono-dim">Single-file binary · every component runs in the same process</text>
</svg>
